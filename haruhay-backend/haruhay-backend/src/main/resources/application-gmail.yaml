# Enable AFTER dev: --spring.profiles.active=dev,gmail
# Secrets are supplied only through the environment by start-gmail.ps1.
spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_ADDRESS:earldomingo165@gmail.com}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
